let rows2 = [];
const lines2 = dataText2.split(String.fromCharCode(10));
for (let i = 0; i < lines2.length; i++) {
  const parts = lines2[i].split(' ').filter(function(p) { return p.length > 0; });
  if (parts.length === 4) {
    const nums = parts.map(Number);
    if (nums.every(function(n) { return !isNaN(n); })) rows2.push(nums);
  }
}
rows2.sort(function(a, b) { return a[3] - b[3]; });
const rank = rows2.map(function(r, i) { return i; });
const freq = rows2.map(function(r) { return r[2]; });
const rec = rows2.map(function(r) { return r[1]; });
const labels2 = rows2.map(function(r) { return 'Customer ' + r[0] + '<br>Monetary rank: ' + '<br>Frequency: ' + r[2] + '<br>Recency: ' + r[1] + 'd'; });
const isDark2 = matchMedia('(prefers-color-scheme: dark)').matches;
const trace2 = {
  x: rank, y: freq, z: rec, mode: 'lines+markers', type: 'scatter3d',
  text: labels2, hoverinfo: 'text',
  line: { color: '#7F77DD', width: 3 },
  marker: { size: 2, color: '#534AB7', opacity: 0.6 }
};
const layout2 = {
  autosize: true, height: 560, margin: { l: 0, r: 0, t: 10, b: 0 },
  paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
  font: { color: isDark2 ? '#c3c2b7' : '#52514e', size: 11 },
  scene: {
    xaxis: { title: 'Customer (sorted by monetary value, low to high)', gridcolor: isDark2 ? '#2c2c2a' : '#e1e0d9' },
    yaxis: { title: 'Frequency', gridcolor: isDark2 ? '#2c2c2a' : '#e1e0d9' },
    zaxis: { title: 'Recency (days)', gridcolor: isDark2 ? '#2c2c2a' : '#e1e0d9' }
  }
};
